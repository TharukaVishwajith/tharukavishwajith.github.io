# Site-wide settings for tharuka.xyz (built by GitHub Pages with Jekyll).
title: Tharuka Sarathchandra
description: >-
  Machine Learning Engineer working across machine learning, NLP, generative AI and data engineering.
  Trains, fine-tunes and deploys AI systems; former lecturer and creator of Wizard LK.
url: "https://tharuka.xyz"
baseurl: ""
lang: en
locale: en_US
author:
  name: Tharuka Sarathchandra
  email: hello@tharuka.xyz
  url: "https://tharuka.xyz/"
  twitter: TharukaVS
twitter:
  username: TharukaVS
  card: summary_large_image
# Used as the publisher logo in article structured data.
logo: /images/apple-touch-icon.png
social:
  name: Tharuka Sarathchandra
  links:
    - https://github.com/TharukaVishwajith
    - https://www.linkedin.com/in/tharukav/
    - https://www.youtube.com/wizardlk
    - https://twitter.com/TharukaVS

# The learning hub. Rename it here and it changes everywhere.
# `url` is where the main site links to. Keep "/learn/" while the hub lives in
# this repo; change it to "https://learn.tharuka.xyz/" once the subdomain is live
# (see docs/subdomain-setup.md).
learn:
  name: Wizard Lab
  tagline: Practical series on software engineering, AI and data, from someone who ships them.
  url: /learn/

# Optional: a GA4 measurement ID such as "G-XXXXXXXXXX". Leave empty to disable analytics.
google_analytics: ""

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
  hard_wrap: false

plugins:
  - jekyll-seo-tag
  - jekyll-feed
  - jekyll-sitemap

feed:
  collections:
    articles:
      path: "/learn/feed.xml"

collections:
  articles:
    output: true
    permalink: /learn/:path/

# `image` is the link-preview picture (WhatsApp, LinkedIn, X...): 1200x630, under 300 KB.
# Pages can override it in their front matter; articles use their own cover's
# preview, made with tools/make_og_covers.py.
defaults:
  - scope:
      path: ""
    values:
      image:
        path: /images/og/default.jpg
        width: 1200
        height: 630
        alt: Tharuka Sarathchandra, Machine Learning Engineer
  - scope:
      path: ""
      type: articles
    values:
      layout: article
      image:
        path: /images/og/wizard-lab.jpg
        width: 1200
        height: 630
        alt: Wizard Lab by Tharuka Sarathchandra
  - scope:
      path: "learn"
    values:
      layout: learn
      image:
        path: /images/og/wizard-lab.jpg
        width: 1200
        height: 630
        alt: Wizard Lab by Tharuka Sarathchandra

exclude:
  - docs/
  - README.md
  - resume.owl
  - Gemfile
  - Gemfile.lock
  - vendor/
  - tools/
