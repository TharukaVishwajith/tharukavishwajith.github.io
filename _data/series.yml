- id: ai-native-development
  title: AI Native Development
  short: AI Native Development
  level: All levels
  color: "#111111"
  description: How software engineering changes when AI agents write much of the code. Thinking for yourself, deciding how much rigour a system needs, harness and context engineering, and reviewing AI-generated work.
  topics: [Critical thinking, Code quality, Harness engineering, Context engineering, Code review]
  cover: /images/learn/ai-native-development.jpg
  cover_alt: "A software engineer and AI assistant planning, building, testing and reviewing software together"
  translations:
    si:
      title: AI Native Development
