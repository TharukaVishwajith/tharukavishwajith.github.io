<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: 'en' }}">
<head>
  {% include head.html css="/assets/css/learn.css" %}
  <link rel="alternate" type="application/atom+xml" title="{{ site.learn.name }}" href="{{ '/learn/feed.xml' | relative_url }}">
</head>
<body class="learn">
  <a class="sr-only" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="container">
      <a class="brand" href="{{ '/learn/' | relative_url }}"><span class="brand-mark">WL</span><span>{{ site.learn.name }}</span></a>
      <nav class="nav" aria-label="Learn">
        <a href="{{ '/learn/#series' | relative_url }}">Series</a>
        <a href="{{ '/learn/articles/' | relative_url }}"{% if page.url == '/learn/articles/' %} aria-current="page"{% endif %}>All articles</a>
        <a href="https://www.youtube.com/wizardlk">Videos</a>
        <a class="nav-cta" href="{{ '/' | relative_url }}">About Tharuka</a>
      </nav>
      {% include header-actions.html %}
    </div>
  </header>
  <main id="main">
    {{ content }}
  </main>
  <footer class="site-footer">
    <div class="container">
      <span>{{ site.learn.name }} by <a href="{{ '/' | relative_url }}">Tharuka Sarathchandra</a> · <a href="{{ '/learn/feed.xml' | relative_url }}">RSS</a></span>
      {% include socials.html %}
    </div>
  </footer>
  <script src="{{ '/assets/js/main.js' | relative_url }}" defer></script>
</body>
</html>
