<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f5a623">
<link rel="icon" href="{{ '/images/favicon.ico' | relative_url }}" sizes="any">
<link rel="icon" href="{{ '/images/favicon.svg' | relative_url }}" type="image/svg+xml">
<link rel="apple-touch-icon" href="{{ '/images/apple-touch-icon.png' | relative_url }}">
<script>
  (function () {
    var t = null;
    try { t = localStorage.getItem("theme"); } catch (e) {}
    if (t !== "dark") t = "light";
    document.documentElement.setAttribute("data-theme", t);
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;600;700&family=Noto+Sans+Sinhala:wght@400;600;700&display=swap" rel="stylesheet">
{% assign asset_version = site.time | date: '%s' %}
<link rel="stylesheet" href="{{ '/assets/css/base.css' | relative_url }}?v={{ asset_version }}">
{% for sheet in include.css %}<link rel="stylesheet" href="{{ sheet | relative_url }}?v={{ asset_version }}">
{% endfor %}
{% if page.url == "/" %}
<title>{{ page.title }}</title>
{% seo title=false %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Person",
  "@id": "{{ '/#person' | absolute_url }}",
  "name": {{ site.author.name | jsonify }},
  "url": {{ '/' | absolute_url | jsonify }},
  "image": {{ '/images/profile.jpg' | absolute_url | jsonify }},
  "jobTitle": "Senior Lead AI Engineer",
  "worksFor": {"@type": "Organization", "name": "Virtusa"},
  "description": {{ site.description | strip | jsonify }},
  "knowsAbout": ["Machine learning", "Natural language processing", "Generative AI", "Agentic AI", "Knowledge graphs", "Ontology", "Context engineering", "Model fine-tuning", "Data engineering", "Software engineering"],
  "alumniOf": "University of Kelaniya",
  "sameAs": {{ site.social.links | jsonify }}
}
</script>
{% else %}
{% seo %}
{% endif %}
{% if site.google_analytics != "" %}
<script async src="https://www.googletagmanager.com/gtag/js?id={{ site.google_analytics }}"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag("js", new Date());
  gtag("config", "{{ site.google_analytics }}");
</script>
{% endif %}
